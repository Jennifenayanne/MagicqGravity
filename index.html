<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: #0f172a;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border: 1px solid #334155;
        }

        .stat-highlight {
            color: #38bdf8;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button.btn-add {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button.btn-add:hover {
            background-color: #0369a1;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0f172a;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #334155;
            transition: all 0.2s;
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: #64748b;
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .task-content input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
        }

        .btn-delete:hover {
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel de Tarefas</h1>
            <p>Organize suas atividades do dia a dia</p>
        </header>

        <div class="stats-bar">
            <span>Total: <span id="stat-total" class="stat-highlight">0</span></span>
            <span>Concluídas: <span id="stat-completed" class="stat-highlight">0</span></span>
            <span>Pendentes: <span id="stat-pending" class="stat-highlight">0</span></span>
        </div>

        <form id="task-form" class="input-group">
            <input type="text" id="task-input" placeholder="Digite uma nova tarefa..." required>
            <button type="submit" class="btn-add">Adicionar</button>
        </form>

        <ul class="task-list" id="task-list">
            <!-- As tarefas serão inseridas dinamicamente via JS -->
        </ul>
    </div>

    <script>
        // Array principal de tarefas
        let tasks = JSON.parse(localStorage.getItem('tasks_data')) || [];

        // Elementos do DOM
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');
        const statTotal = document.getElementById('stat-total');
        const statCompleted = document.getElementById('stat-completed');
        const statPending = document.getElementById('stat-pending');

        // Salva dados no LocalStorage
        function saveData() {
            localStorage.setItem('tasks_data', JSON.stringify(tasks));
            render();
        }

        // Adiciona nova tarefa
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();

            if (text !== '') {
                tasks.push({
                    id: Date.now(),
                    text: text,
                    completed: false
                });
                taskInput.value = '';
                saveData();
            }
        });

        // Alterna o status da tarefa (concluída/pendente)
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveData();
        }

        // Remove uma tarefa
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveData();
        }

        // Atualiza os contadores
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;

            statTotal.textContent = total;
            statCompleted.textContent = completed;
            statPending.textContent = pending;
        }

        // Renderiza a lista na tela
        function render() {
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">Nenhuma tarefa cadastrada.</div>';
            } else {
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;

                    li.innerHTML = `
                        <div class="task-content" onclick="toggleTask(${task.id})">
                            <input type="checkbox" ${task.completed ? 'checked' : ''}>
                            <span>${escapeHtml(task.text)}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteTask(${task.id})" title="Excluir">✕</button>
                    `;

                    taskList.appendChild(li);
                });
            }

            updateStats();
        }

        // Prevenção simples contra XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Inicializa a aplicação
        render();
    </script>
</body>
</html>
