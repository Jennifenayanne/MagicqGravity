<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explicação: Os Pilares da Programação</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        header h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 24px;
        }

        /* Abas de Navegação */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #94a3b8;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #f8fafc;
            background-color: #334155;
        }

        .tab-btn.active {
            color: #38bdf8;
            background-color: #0f172a;
            border: 1px solid #38bdf8;
        }

        /* Caixa de Conteúdo Explicativo */
        .content-box {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            line-height: 1.6;
            min-height: 160px;
        }

        .content-box h2 {
            color: #f8fafc;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .content-box p {
            color: #cbd5e1;
            font-size: 1rem;
        }

        .code-example {
            margin-top: 15px;
            background-color: #1e293b;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            color: #38bdf8;
            font-size: 0.9rem;
            border-left: 3px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>O que é Programação Web?</h1>
            <p>Clique nas abas abaixo para entender o papel de cada tecnologia.</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="mostrarExplicacao('html')">HTML</button>
            <button class="tab-btn" onclick="mostrarExplicacao('css')">CSS</button>
            <button class="tab-btn" onclick="mostrarExplicacao('js')">JavaScript</button>
        </nav>

        <main class="content-box" id="caixa-explicacao">
            <!-- Conteúdo inserido dinamicamente via JavaScript -->
        </main>
    </div>

    <script>
        // Objeto contendo os textos explicativos de cada conceito
        const explicacoes = {
            html: {
                titulo: "HTML (Linguagem de Marcação de Hipertexto)",
                texto: "O HTML é a estrutura do site. Pense nele como os tijolos e vigas de uma casa. Ele define onde ficam os títulos, parágrafos, imagens e botões.",
                exemplo: "&lt;h1&gt;Este é um título em HTML&lt;/h1&gt;"
            },
            css: {
                titulo: "CSS (Folhas de Estilo em Cascata)",
                texto: "O CSS é responsável pelo visual e design. Ele define cores, fontes, alinhamentos, tamanhos e efeitos visuais, deixando a estrutura bonita.",
                exemplo: "h1 { color: blue; font-size: 20px; }"
            },
            js: {
                titulo: "JavaScript (Linguagem de Programação)",
                texto: "O JavaScript traz a interatividade. Ele responde aos cliques do usuário, processa dados, faz cálculos e atualiza a tela sem precisar recarregar a página.",
                exemplo: "button.addEventListener('click', acao);"
            }
        };

        // Elementos do DOM
        const caixaExplicacao = document.getElementById('caixa-explicacao');
        const botoes = document.querySelectorAll('.tab-btn');

        // Função para atualizar o texto na tela
        function mostrarExplicacao(tecnologia) {
            // Remove a classe 'active' de todos os botões
            botoes.forEach(btn => btn.classList.remove('active'));

            // Adiciona a classe 'active' ao botão clicado
            event.target.classList.add('active');

            // Busca os dados da tecnologia selecionada
            const info = explicacoes[tecnologia];

            // Renderiza o texto na caixa explicativa
            caixaExplicacao.innerHTML = `
                <h2>${info.titulo}</h2>
                <p>${info.texto}</p>
                <div class="code-example">${info.exemplo}</div>
            `;
        }

        // Inicializa a página mostrando o HTML por padrão
        mostrarExplicacao('html');
    </script>

</body>
</html>
